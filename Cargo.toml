[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.94.1"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
bcs = "0.2.1"
encoding_rs = "0.8"
iso3166 = "1"
maxminddb = "0.30"
pwhash = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2.0"
hex = "0.4"
ed25519-dalek = "3.0.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "fs", "process", "io-util"] }
curve25519-dalek = "5.0.0"
sha2 = "0.11"
actix-web = "4.9"
actix-cors = "0.7"
actix-multipart = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
clap = { version = "4.6", features = ["derive"] }
bytes = "1"
moka = { version = "0.12.16", features = ["future"] }
object_store = { version = "0.12.4", features = ["aws"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

ech-board-entity = { path = "crates/ech-board-entity" }
ech-board-entity-macros = { path = "crates/ech-board-entity-macros" }
ech-db-protocol = { git = "https://github.com/ech-bz/ech-db.git", rev = "31a01c9cb662488104f9aef2022621366f95bbf2" }
ech-db-guest = { git = "https://github.com/ech-bz/ech-db.git", rev = "31a01c9cb662488104f9aef2022621366f95bbf2" }
ech-db-sdk = { git = "https://github.com/ech-bz/ech-db.git", rev = "31a01c9cb662488104f9aef2022621366f95bbf2" }

[profile.release]
lto = "thin"
strip = true

[profile.guest]
inherits = "release"
opt-level = 3
panic = "abort"
lto = true
